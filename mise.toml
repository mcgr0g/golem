# Задачи проекта. Параметры хоста — в mise.local.toml (вне git), пример: mise.local.toml.example
# Документация: docs/operations/tunnel.md

[env]
# sops на macOS по умолчанию ищет ключ в ~/Library/Application Support
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"

# Версии закреплены (python и uv нужны бэкенду pipx для Ansible и линтеров)
[tools]
python = "3.12.7"
uv = "0.11.7"
"pipx:ansible-core" = "2.21.5"
"pipx:ansible-lint" = "26.10.1"
"pipx:yamllint" = "1.38.0"

[tasks."tunnel:up"]
description = "Поднять SSH-туннель к локальным интерфейсам VPS (панель CPA и др.)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${GOLEM_SSH_HOST:?задайте GOLEM_SSH_HOST в mise.local.toml}"
: "${GOLEM_SSH_PORT:?задайте GOLEM_SSH_PORT в mise.local.toml}"
: "${GOLEM_SSH_USER:=ronnie}"
: "${GOLEM_TUNNEL_FORWARDS:=8317:127.0.0.1:8317}"
sock="${TMPDIR:-/tmp}/golem-tunnel-${GOLEM_SSH_HOST}.sock"
if [ -S "$sock" ] && ssh -S "$sock" -O check "$GOLEM_SSH_USER@$GOLEM_SSH_HOST"; then
  echo "туннель уже поднят ($sock)"; exit 0
fi
args=()
for f in $GOLEM_TUNNEL_FORWARDS; do args+=(-L "127.0.0.1:$f"); done
ssh -f -N -M -S "$sock" -p "$GOLEM_SSH_PORT" \
  -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
  "${args[@]}" "$GOLEM_SSH_USER@$GOLEM_SSH_HOST"
echo "туннель поднят: $GOLEM_TUNNEL_FORWARDS"
'''

[tasks."tunnel:status"]
description = "Состояние SSH-туннеля"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${GOLEM_SSH_HOST:?}"; : "${GOLEM_SSH_USER:=ronnie}"
sock="${TMPDIR:-/tmp}/golem-tunnel-${GOLEM_SSH_HOST}.sock"
ssh -S "$sock" -O check "$GOLEM_SSH_USER@$GOLEM_SSH_HOST"
'''

[tasks."tunnel:down"]
description = "Закрыть SSH-туннель"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${GOLEM_SSH_HOST:?}"; : "${GOLEM_SSH_USER:=ronnie}"
sock="${TMPDIR:-/tmp}/golem-tunnel-${GOLEM_SSH_HOST}.sock"
ssh -S "$sock" -O exit "$GOLEM_SSH_USER@$GOLEM_SSH_HOST"
'''

[tasks."cpa:panel"]
description = "Поднять туннель и открыть панель управления CPA в браузере"
depends = ["tunnel:up"]
run = 'open "http://127.0.0.1:${GOLEM_CPA_LOCAL_PORT:-8317}/management.html"'

# Секреты (sops + age). Логика — scripts/secrets.sh; документация: docs/operations/secrets.md
[tasks."secrets:init"]
description = "Создать age-ключ (если нет), .sops.yaml и секреты хоста: secrets:init <host>"
run = "scripts/secrets.sh init"

[tasks."secrets:edit"]
description = "Править секреты в редакторе: secrets:edit <host|common>"
run = "scripts/secrets.sh edit"

[tasks."secrets:rotate"]
description = "Ротировать секреты: secrets:rotate <host> <uuid|paths|llm|mgmt|all>"
run = "scripts/secrets.sh rotate"

# Сборка артефактов на Mac. Документация: docs/operations/build-artifacts.md
[tasks."build:artifacts"]
description = "Собрать caddy/web/relay в build/: build:artifacts [caddy|web|relay|all]; TARGET_ARCH=amd64|arm64"
run = "scripts/build-artifacts.sh"

[tasks."ansible:lint"]
description = "yamllint + ansible-lint + syntax-check (lima)"
dir = "infra/ansible"
run = '''
#!/usr/bin/env bash
set -euo pipefail
yamllint .
ansible-lint
ansible-playbook -i inventories/lima/hosts.yml playbooks/site.yml --syntax-check
'''

[tasks."ansible:site"]
description = "Прогон site.yml: ansible:site <lima|stage|prod> [аргументы ansible-playbook, например --tags caddy --check --diff]"
dir = "infra/ansible"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# usage_args приходит shell-экранированной строкой: eval восстанавливает границы аргументов (-e "a=1 b=2")
eval "set -- ${usage_args:-}"
ansible-playbook -i inventories/${usage_env}/hosts.yml playbooks/site.yml "$@"
'''
usage = '''
arg "<env>" help="lima, stage или prod"
arg "[args]..." var=#true help="аргументы ansible-playbook"
'''

[tasks."ansible:bootstrap"]
description = "Первичная настройка свежего VPS под root (22; при GOLEM_SSH_PORT_INTERNAL — внешний GOLEM_SSH_PORT): ansible:bootstrap <stage|prod> [аргументы]"
dir = "infra/ansible"
run = '''
#!/usr/bin/env bash
set -euo pipefail
eval "set -- ${usage_args:-}"
# без DNAT свежий VPS слушает 22; с DNAT (задан внутренний порт) он доступен снаружи только на внешнем порту
bootstrap_port=22
if [[ -n "${GOLEM_SSH_PORT_INTERNAL:-}" ]]; then
  bootstrap_port="${GOLEM_SSH_PORT:?задайте GOLEM_SSH_PORT в mise.local.toml}"
fi
ansible-playbook -i inventories/${usage_env}/hosts.yml playbooks/bootstrap.yml -e "ansible_port=${bootstrap_port}" -e ansible_user=root "$@"
'''
usage = '''
arg "<env>" help="stage или prod"
arg "[args]..." var=#true help="аргументы ansible-playbook"
'''
