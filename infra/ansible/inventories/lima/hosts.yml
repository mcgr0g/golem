all:
  children:
    golem:
      hosts:
        golem-test:
          ansible_host: 127.0.0.1
          ansible_port: "{{ ssh_external_port }}"   # проброс Lima на 22 гостя
          ansible_user: "{{ ssh_user }}"
          # VM пересоздаётся, ключи хоста меняются: проверка отпечатка только для тестового стенда
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
