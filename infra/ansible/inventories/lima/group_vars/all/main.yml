# Lima пробрасывает 22 гостя сама, поэтому порт sshd не меняем.
ssh_port: 22
ssh_external_port: 60022
target_arch: arm64
domain: golem.test
duckdns_subdomain: ""
tls_mode: internal
# Ключ в Lima кладёт сам шаблон (loadDotSSHPubKeys); пустой список = authorized_keys не трогаем.
ssh_authorized_keys: []
ssh_user: ronnie
# Опциональный мониторинг проверяем на стенде (ADR 0011)
gatus_enabled: true
# Фиктивный апстрим для проверки LLM-агентов (tests/fake-llm/lima.sh start); реальных доступов в Lima нет
cliproxyapi_openai_compatibility:
  - name: fake-llm
    base-url: http://127.0.0.1:19999/v1
    api-key-entries:
      - api-key: fake-upstream-not-a-secret
    models:
      - { name: fake-upstream-a, alias: fake-chat-a }
      - { name: fake-upstream-b, alias: fake-chat-b }
# адреса/CIDR шлюза провайдера, шлющего PROXY protocol (SNAT); через пробел; пусто = белый IP (ADR 0013)
proxy_protocol_from: "{{ lookup('ansible.builtin.env', 'GOLEM_PROXY_PROTOCOL_FROM', default='') | split }}"
xray_transport: "xhttp"
# NaïveProxy (Caddy forward_proxy, ADR 0015): выключен по умолчанию; GOLEM_NAIVE_ENABLED=true включает
naive_enabled: "{{ lookup('ansible.builtin.env', 'GOLEM_NAIVE_ENABLED', default='false') | bool }}"
