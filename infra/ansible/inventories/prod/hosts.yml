# Параметры хоста берутся из окружения (mise.local.toml, вне git): GOLEM_SSH_HOST, GOLEM_SSH_PORT,
# GOLEM_DOMAIN, GOLEM_DUCKDNS_SUBDOMAIN. Для bootstrap.yml порт 22: -e ansible_port=22
all:
  children:
    golem:
      hosts:
        golem01:
          ansible_host: "{{ lookup('ansible.builtin.env', 'GOLEM_SSH_HOST', default=Undefined) }}"
          ansible_port: "{{ ssh_port }}"
          ansible_user: "{{ ssh_user }}"
