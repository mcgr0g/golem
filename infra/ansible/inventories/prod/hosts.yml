# Параметры хоста берутся из окружения (mise.local.toml, вне git): GOLEM_SSH_HOST, GOLEM_SSH_PORT (внешний),
# GOLEM_SSH_PORT_INTERNAL (необязательный), GOLEM_DOMAIN, GOLEM_DUCKDNS_SUBDOMAIN. bootstrap.yml: порт задаёт mise ansible:bootstrap
all:
  children:
    golem:
      hosts:
        golem01:
          ansible_host: "{{ lookup('ansible.builtin.env', 'GOLEM_SSH_HOST', default=Undefined) }}"
          ansible_port: "{{ ssh_external_port }}"
          ansible_user: "{{ ssh_user }}"
