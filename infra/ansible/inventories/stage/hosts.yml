# Параметры хоста — из окружения (mise.local.toml): GOLEM_SSH_HOST, GOLEM_SSH_PORT, GOLEM_DOMAIN, GOLEM_DUCKDNS_SUBDOMAIN.
# Для bootstrap.yml порт 22: -e ansible_port=22 -e ansible_user=root
all:
  children:
    golem:
      hosts:
        golem-dev:
          ansible_host: "{{ lookup('ansible.builtin.env', 'GOLEM_SSH_HOST', default=Undefined) }}"
          ansible_port: "{{ ssh_port }}"
          ansible_user: "{{ ssh_user }}"
