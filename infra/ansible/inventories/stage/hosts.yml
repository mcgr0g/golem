# Параметры хоста — из окружения (mise.local.toml): GOLEM_SSH_HOST, GOLEM_SSH_PORT (внешний), GOLEM_SSH_PORT_INTERNAL (необязательный), GOLEM_DOMAIN, GOLEM_DUCKDNS_SUBDOMAIN.
# bootstrap.yml: порт и пользователь задаёт mise ansible:bootstrap (-e ansible_port=... -e ansible_user=root)
all:
  children:
    golem:
      hosts:
        golem-dev:
          ansible_host: "{{ lookup('ansible.builtin.env', 'GOLEM_SSH_HOST', default=Undefined) }}"
          ansible_port: "{{ ssh_external_port }}"
          ansible_user: "{{ ssh_user }}"
