# Стенд на реальном VPS (другая локация, x86_64): bootstrap, боевой TLS, замер RAM. Параметры — из окружения.
ssh_user: ronnie
# внешний порт (куда подключается Mac) и порт sshd на VPS; при DNAT у провайдера они различаются
ssh_external_port: "{{ lookup('ansible.builtin.env', 'GOLEM_SSH_PORT', default=Undefined) | int }}"
ssh_port: "{{ lookup('ansible.builtin.env', 'GOLEM_SSH_PORT_INTERNAL', default='') | default(ssh_external_port, true) | int }}"
target_arch: amd64
domain: "{{ lookup('ansible.builtin.env', 'GOLEM_DOMAIN', default=Undefined) }}"
duckdns_subdomain: "{{ lookup('ansible.builtin.env', 'GOLEM_DUCKDNS_SUBDOMAIN', default=Undefined) }}"
tls_mode: acme   # как на проде (TLS-ALPN-01)
# Боевой Let's Encrypt (пусто). Для отладки выпуска — staging: https://acme-staging-v02.api.letsencrypt.org/directory
caddy_acme_ca: ""
gatus_enabled: true
# ssh_authorized_keys — в ssh_keys.yml (вне git), пример: ssh_keys.yml.example
# адреса/CIDR шлюза провайдера, шлющего PROXY protocol (SNAT); через пробел; пусто = белый IP (ADR 0013)
proxy_protocol_from: "{{ lookup('ansible.builtin.env', 'GOLEM_PROXY_PROTOCOL_FROM', default='') | split }}"
xray_transport: "xhttp"
