---
caddy_acme_ca: ""   # URL каталога ACME (staging для dns01_duckdns); пусто = боевой Let's Encrypt
caddy_web_root: /var/www/omp-web
caddy_landing_root: /var/www/landing
# Лимиты событий в минуту на IP; значения — оценка, подбор на проде (Q8)
caddy_rl_ws: 300   # WS-рукопожатий в минуту на IP: браузер через туннель открывает десятки соединений за секунды
caddy_rl_llm: 120
caddy_rl_static: 120

# PROXY protocol от шлюза провайдера (SNAT): из общего proxy_protocol_from; пусто = белый IP, блок не рендерится
caddy_proxy_protocol_from: "{{ proxy_protocol_from | default([]) }}"
# NaïveProxy: forward_proxy, адрес сайта с :443 и order first; из общего naive_enabled; выключено = рендер прежний
caddy_naive_enabled: "{{ naive_enabled | default(false) | bool }}"
