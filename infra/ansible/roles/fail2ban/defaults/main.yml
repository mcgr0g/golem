---
# Белый список (IP владельца) в git не фиксируем: задаётся в host_vars/окружении
fail2ban_ignoreip: []
fail2ban_sshd_maxretry: 3
fail2ban_sshd_bantime: 72h
fail2ban_sshd_findtime: 10m
# 429 от rate limit Caddy: повторные нарушители банятся на сутки
fail2ban_ratelimit_maxretry: 20
fail2ban_ratelimit_findtime: 10m
fail2ban_ratelimit_bantime: 24h
# Серии 401/404 в закрытых префиксах (сканеры)
fail2ban_auth_maxretry: 15
fail2ban_auth_findtime: 10m
fail2ban_auth_bantime: 24h
fail2ban_caddy_log: /var/log/caddy/access.log
